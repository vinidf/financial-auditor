<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Auditor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f8fafc;
  --card:#ffffff;
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --brand:#4f46e5;
  --brand-hover:#4338ca;
  --brand-soft:#e0e7ff;
  --pos:#10b981;
  --pos-soft:#d1fae5;
  --neg:#f43f5e;
  --neg-soft:#ffe4e6;
  --warn:#f59e0b;
  --warn-soft:#fef3c7;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --shadow:0 4px 12px rgb(15 23 42 / .08);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
  padding:32px 16px 80px;
}
.wrap{max-width:620px;margin:0 auto}
header{text-align:center;margin-bottom:28px}
header h1{font-size:29px;font-weight:800;letter-spacing:-.03em}
header p{font-size:14px;color:var(--muted);margin-top:6px}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:24px;
  box-shadow:var(--shadow);
  margin-bottom:22px;
}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:8px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.field input,.field select{
  width:100%;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  font:500 15px var(--sans);
  padding:14px 15px;
  border-radius:12px;
}
.field input:focus,.field select:focus{
  outline:none;
  border-color:var(--brand);
  background:#fff;
  box-shadow:0 0 0 4px var(--brand-soft);
}
.btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  background:linear-gradient(135deg,var(--brand),var(--brand-hover));
  color:#fff;
  font:700 16px var(--sans);
  cursor:pointer;
}
.btn:hover{filter:brightness(1.05)}
.btn-ghost{
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:10px;
  padding:10px 14px;
  font:600 14px var(--sans);
  cursor:pointer;
}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed}
.quiz-card{display:none}
.progress-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}
.progress-label{font-size:13px;font-weight:700;color:var(--muted)}
.progress{
  height:7px;
  background:var(--line);
  border-radius:99px;
  overflow:hidden;
  margin-bottom:22px;
}
.progress span{
  display:block;
  height:100%;
  width:0;
  background:var(--brand);
  transition:width .25s ease;
}
.qtext{font-size:18px;font-weight:750;line-height:1.4;margin-bottom:10px}
.hint{
  font-size:13px;
  line-height:1.5;
  color:var(--muted);
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:16px;
}
.opts{display:grid;gap:10px}
.opt{
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:11px;
  padding:13px;
  text-align:left;
  font:600 14px var(--sans);
  cursor:pointer;
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft)}
.slider-wrap{margin:18px 0}
.slider{width:100%}
.slider-labels{
  display:flex;
  justify-content:space-between;
  gap:12px;
  color:var(--muted);
  font-size:12px;
  margin-top:8px;
}
.slider-value{
  display:inline-block;
  min-width:44px;
  text-align:center;
  padding:3px 9px;
  border-radius:99px;
  background:var(--brand-soft);
  color:var(--brand);
  font-weight:800;
}
.quiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.result{display:none}
.result.active{display:block}
.rhead{
  color:var(--brand);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
}
.rtitle{font-size:22px;font-weight:800;margin:5px 0 18px}
.score-row{
  padding:16px;
  border:1px solid var(--line);
  background:var(--bg);
  border-radius:12px;
  margin-bottom:22px;
}
.score-bar{
  height:10px;
  background:var(--line);
  border-radius:99px;
  overflow:hidden;
  margin-bottom:8px;
}
.score-fill{height:100%;width:0;transition:width .6s ease}
.score-meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  color:var(--muted);
}
.section{margin-bottom:22px}
.section h3{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--muted);
  border-bottom:2px solid var(--line);
  padding-bottom:7px;
  margin-bottom:4px;
}
.factor{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:14px;
}
.factor:last-child{border-bottom:0}
.badge{
  flex-shrink:0;
  border-radius:7px;
  padding:3px 8px;
  font-weight:800;
}
.badge.pos{background:var(--pos-soft);color:var(--pos)}
.badge.neg{background:var(--neg-soft);color:var(--neg)}
.badge.zero{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.verdict{
  border-radius:15px;
  padding:20px;
  border:1px solid transparent;
  margin-top:20px;
}
.verdict.strong,.verdict.approved{background:var(--pos-soft);border-color:#86efac}
.verdict.caution{background:var(--warn-soft);border-color:#fcd34d}
.verdict.veto{background:var(--neg-soft);border-color:#fda4af}
.vlabel{font-size:21px;font-weight:800;margin-bottom:5px}
.vsub{font-size:13px;color:var(--muted);margin-bottom:8px}
.quarantine{
  background:#fff;
  border:1px solid rgb(255 255 255 / .7);
  border-radius:11px;
  padding:12px;
  margin:12px 0 14px;
}
.quarantine strong{display:block;font-size:16px;margin-top:3px}
.verdict ol{padding-left:20px;font-size:14px;line-height:1.55}
.tips{
  margin-top:16px;
  border:1px solid var(--line);
  background:var(--bg);
  border-radius:12px;
  padding:15px;
}
.tips h4{font-size:14px;margin-bottom:8px}
.tips p{font-size:13px;line-height:1.5;color:var(--muted);margin-top:6px}
.history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.history-head h2{font-size:18px}
.link-btn{
  border:0;
  background:transparent;
  color:var(--neg);
  font:700 13px var(--sans);
  cursor:pointer;
}
.history-list{display:grid;gap:10px}
.history-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:13px;
}
.history-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.history-redo{
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--brand);
  border-radius:9px;
  padding:8px 10px;
  font:700 12px var(--sans);
  cursor:pointer;
}
.history-delete{
  border:0;
  background:transparent;
  color:var(--neg);
  font-size:20px;
  cursor:pointer;
}
.result-redo{
  margin-top:16px;
}
.history-title{font-size:14px;font-weight:750}
.history-meta{font-size:12px;color:var(--muted);margin-top:4px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:16px}
@media(max-width:520px){
  body{padding-top:20px}
  .card{padding:18px}
  .score-meta{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Financial Auditor</h1>
    <p>Pause, assess and make more intentional purchase decisions.</p>
  </header>

  <div class="card">
    <div class="field">
      <label for="itemName">Item</label>
      <input id="itemName" type="text" placeholder="What are you considering buying?">
    </div>
    <div class="field">
      <label for="itemValue">Amount (BRL)</label>
      <input id="itemValue" type="number" min="0" step="0.01" placeholder="0.00">
    </div>
    <div class="field">
      <label for="itemCategory">Category</label>
      <select id="itemCategory">
        <option value="essencial">Essential</option>
        <option value="ferramenta">Tool / Productive Equipment</option>
        <option value="lazer">Leisure / Aesthetics / Convenience</option>
        <option value="terceiro">Help / Loan to Third Party</option>
      </select>
    </div>
  </div>

  <div class="card quiz-card" id="quizCard">
    <div class="progress-row">
      <span class="progress-label" id="quizStepLabel"></span>
    </div>
    <div class="progress"><span id="quizFill"></span></div>
    <div id="quizQuestion"></div>
    <div class="quiz-nav">
      <button class="btn-ghost" id="quizBack" type="button">Back</button>
      <button class="btn-ghost" id="sliderNext" type="button" style="display:none">Continue</button>
    </div>
  </div>

  <button class="btn" id="startBtn" type="button">Start Audit</button>

  <div class="card result" id="resultEl" style="margin-top:22px"></div>

  <div class="card">
    <div class="history-head">
      <h2>History</h2>
      <button class="link-btn" id="clearHistory" type="button">Clear</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
const STORAGE_KEY='financial_auditor_v4';
const QUESTIONS=[
  {id:'q_need',f:1,type:'buttons',text:'Does this solve a real need right now?',hint:'If you did not buy this today, what would actually break or stop working?',opts:[
    ['Yes, needed',18],['Sort of',0],['Can wait',-15]
  ]},
  {id:'q_own',f:1,type:'buttons',text:'Does this unlock a meaningful capability you do not currently have?',hint:'List what you already own that could do this and what it truly cannot do.',opts:[
    ['Yes, I cannot do this with what I own',10],['Somewhat, real limitations exist',0],['No, it mostly duplicates what I own',-22]
  ]},
  {id:'q_pattern',f:1,type:'buttons',text:'Have you bought similar items recently that remain unused?',hint:'Recent unused purchases are a strong warning sign.',opts:[
    ['None',8],['One',-6],['Several',-20]
  ]},
  {id:'q_alt',f:1,type:'buttons',text:'Could you solve the same problem for less?',hint:'Name one cheaper alternative before answering.',opts:[
    ['No, I compared options',14],['I have not checked seriously',-2],['Yes, there is a viable cheaper option',-16]
  ]},
  {id:'q_use',f:2,type:'slider',text:'How much realistic use will this get?',hint:'Count realistic uses in the next 30 days.',min:-15,max:15,minLabel:'Little use',maxLabel:'Frequent use'},
  {id:'q_price',f:2,type:'buttons',text:'Is the price fair for your situation?',hint:'Have you compared prices or does it merely feel acceptable?',opts:[
    ['Fair and reasonable',8],['Acceptable',2],['Too high',-12]
  ]},
  {id:'q_longterm',f:2,type:'buttons',text:'Will it still be worthwhile one year from now?',hint:'Picture the item after novelty has faded.',opts:[
    ['Yes, clearly',10],['Maybe',0],['Probably not',-14]
  ]},
  {id:'q_trigger',f:3,type:'buttons',text:'How did this item enter your radar?',hint:'Ads and feeds are designed to manufacture urgency.',opts:[
    ['I searched for it',6],['Ad or algorithm',-4],['Social media or someone else has it',-12]
  ]},
  {id:'q_emotion',f:3,type:'buttons',text:'What is your emotional state right now?',hint:'Stress, boredom and excitement can all distort spending decisions.',opts:[
    ['Calm and neutral',5],['Bored, stressed or anxious',-8],['Excited or euphoric',-6]
  ]},
  {id:'q_habit',f:3,type:'buttons',text:'Does this support a productive habit?',hint:'Does it build health, work or skill, or only fill a moment?',opts:[
    ['Yes, directly',14],['Indirectly',4],['No',-6]
  ]},
  {id:'q_motive',f:3,type:'buttons',text:'How long have you been considering this purchase?',hint:'Count from when you first seriously considered buying it.',opts:[
    ['More than a week',8],['1 to 7 days',0],['Less than 24 hours',-12]
  ]},
  {id:'q_budget',f:3,type:'slider',text:'How comfortably does it fit this month?',hint:'Name the bills or goals competing for this money.',min:-16,max:16,minLabel:'Does not fit',maxLabel:'Comfortable'}
];

const CATEGORY_BASE={essencial:44,ferramenta:28,lazer:36,terceiro:8};
const CATEGORY_LABEL={
  essencial:'Essential',
  ferramenta:'Tool / Productive Equipment',
  lazer:'Leisure / Aesthetics / Convenience',
  terceiro:'Help / Loan to Third Party'
};

let answers={};
let quizStep=0;

function getQuarantine(value){
  if(value<=50)return '2 hours';
  if(value<=100)return '6 hours';
  if(value<=150)return '1 day';
  if(value<=200)return '2 days';
  if(value<=300)return '3 days';
  if(value<=400)return '5 days';
  if(value<=500)return '7 days';
  if(value<=700)return '10 days';
  if(value<1000)return '15 days';
  return '30 days';
}

function loadHistory(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}
  catch{return[]}
}

function saveHistory(items){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(items));
}

function escapeHtml(value){
  const div=document.createElement('div');
  div.textContent=String(value);
  return div.innerHTML;
}

function startQuiz(){
  const item=document.getElementById('itemName').value.trim();
  const value=Number(document.getElementById('itemValue').value);
  if(!item||!Number.isFinite(value)||value<=0){
    alert('Fill in a valid item and amount.');
    return;
  }
  answers={};
  quizStep=0;
  document.getElementById('startBtn').style.display='none';
  document.getElementById('resultEl').classList.remove('active');
  document.getElementById('quizCard').style.display='block';
  renderQuestion();
}

function renderQuestion(){
  const q=QUESTIONS[quizStep];
  document.getElementById('quizStepLabel').textContent=`Question ${quizStep+1} of ${QUESTIONS.length}`;
  document.getElementById('quizFill').style.width=`${quizStep/QUESTIONS.length*100}%`;
  document.getElementById('quizBack').disabled=quizStep===0;
  const next=document.getElementById('sliderNext');

  if(q.type==='buttons'){
    next.style.display='none';
    document.getElementById('quizQuestion').innerHTML=`
      <div class="qtext">${escapeHtml(q.text)}</div>
      <div class="hint">${escapeHtml(q.hint)}</div>
      <div class="opts">
        ${q.opts.map((opt,index)=>`<button class="opt" type="button" data-index="${index}">${escapeHtml(opt[0])}</button>`).join('')}
      </div>`;
    document.querySelectorAll('.opt').forEach(button=>{
      button.addEventListener('click',()=>{
        const index=Number(button.dataset.index);
        answers[q.id]={label:q.opts[index][0],weight:q.opts[index][1],f:q.f};
        nextQuestion();
      });
    });
  }else{
    next.style.display='block';
    const saved=answers[q.id];
    const step=saved?saved.step:3;
    const weight=Math.round(q.min+(q.max-q.min)*(step/6));
    answers[q.id]={label:weight>0?'Favorable':weight<0?'Unfavorable':'Neutral',weight,f:q.f,step};
    document.getElementById('quizQuestion').innerHTML=`
      <div class="qtext">${escapeHtml(q.text)}</div>
      <div class="hint">${escapeHtml(q.hint)}</div>
      <div class="slider-wrap">
        <input class="slider" id="currentSlider" type="range" min="0" max="6" step="1" value="${step}">
        <div class="slider-labels">
          <span>${escapeHtml(q.minLabel)}</span>
          <span class="slider-value" id="sliderValue">${weight>0?'+':''}${weight}</span>
          <span>${escapeHtml(q.maxLabel)}</span>
        </div>
      </div>`;
    document.getElementById('currentSlider').addEventListener('input',event=>{
      const current=Number(event.target.value);
      const currentWeight=Math.round(q.min+(q.max-q.min)*(current/6));
      answers[q.id]={label:currentWeight>0?'Favorable':currentWeight<0?'Unfavorable':'Neutral',weight:currentWeight,f:q.f,step:current};
      document.getElementById('sliderValue').textContent=`${currentWeight>0?'+':''}${currentWeight}`;
    });
  }
}

function nextQuestion(){
  if(quizStep<QUESTIONS.length-1){
    quizStep++;
    renderQuestion();
  }else{
    finishQuiz();
  }
}

function finishQuiz(){
  document.getElementById('quizCard').style.display='none';
  document.getElementById('startBtn').style.display='block';
  document.getElementById('startBtn').textContent='Audit Again';
  runAnalysis();
}

function goBack(){
  if(quizStep>0){
    quizStep--;
    renderQuestion();
  }
}

function runAnalysis(){
  const item=document.getElementById('itemName').value.trim();
  const value=Number(document.getElementById('itemValue').value);
  const category=document.getElementById('itemCategory').value;
  let dampen=1;
  let bonus=0;

  if(value<=30){dampen=.15;bonus=15}
  else if(value<=50){dampen=.3;bonus=12}
  else if(value<=150){dampen=.55;bonus=6}
  else if(value<=400){dampen=.8}

  let score=CATEGORY_BASE[category]+bonus;
  const groups={1:[],2:[],3:[]};

  for(const q of QUESTIONS){
    const answer=answers[q.id];
    if(!answer)continue;
    const weight=answer.weight<0?Math.round(answer.weight*dampen):answer.weight;
    score+=weight;
    groups[q.f].push({label:`${q.text}: ${answer.label}`,weight});
  }

  if(bonus>0){
    groups[2].push({label:`Low ticket: limited financial exposure`,weight:bonus});
  }

  score=Math.max(0,Math.min(100,score));

  let verdict='REJECTED';
  let verdictClass='veto';
  let status='REJECTED';
  let color='var(--neg)';

  if(score>=80){
    verdict='STRONG BUY';
    verdictClass='strong';
    status='STRONG BUY';
    color='var(--pos)';
  }else if(score>=60){
    verdict='APPROVED';
    verdictClass='approved';
    status='APPROVED';
    color='var(--pos)';
  }else if(score>=40){
    verdict='PROCEED WITH CAUTION';
    verdictClass='caution';
    status='CAUTION ZONE';
    color='var(--warn)';
  }

  const negatives=QUESTIONS
    .map(q=>({q,answer:answers[q.id]}))
    .filter(x=>x.answer&&x.answer.weight<0)
    .sort((a,b)=>a.answer.weight-b.answer.weight);

  const directives=[];
  if(verdictClass==='veto'){
    directives.push('Do not buy it now. Complete the recommended quarantine first.');
    if(negatives[0])directives.push(`Main concern: ${negatives[0].q.text.toLowerCase()}`);
  }else if(verdictClass==='caution'){
    directives.push('You may proceed later, but only after the quarantine period.');
    if(negatives[0])directives.push(`Review this risk: ${negatives[0].q.text.toLowerCase()}`);
  }else{
    directives.push('The purchase appears reasonable based on your answers.');
    directives.push('Still respect the quarantine period before paying.');
  }

  const quarantine=getQuarantine(value);
  const sectionTitles={
    1:'Technical Viability / Asset',
    2:'Cost-Benefit / ROI',
    3:'Behavior / Habit'
  };

  const sections=[1,2,3].map(group=>`
    <div class="section">
      <h3>${group}. ${sectionTitles[group]}</h3>
      ${(groups[group].length?groups[group]:[{label:'No factor selected',weight:0}]).map(factor=>`
        <div class="factor">
          <span>${escapeHtml(factor.label)}</span>
          <span class="badge ${factor.weight>0?'pos':factor.weight<0?'neg':'zero'}">${factor.weight>0?'+':''}${factor.weight}</span>
        </div>`).join('')}
    </div>`).join('');

  const html=`
    <div class="rhead">${escapeHtml(CATEGORY_LABEL[category])}</div>
    <div class="rtitle">${escapeHtml(item)}: R$ ${value.toFixed(2)}</div>
    <div class="score-row">
      <div class="score-bar"><div class="score-fill" id="scoreFill" style="background:${color}"></div></div>
      <div class="score-meta">
        <span>Score <strong>${score}/100</strong></span>
        <span>${status}</span>
      </div>
    </div>
    ${sections}
    <div class="verdict ${verdictClass}">
      <div class="vlabel">${verdict}</div>
      <div class="vsub">Final score: ${score}/100</div>
      <ol>${directives.map(item=>`<li>${escapeHtml(item)}</li>`).join('')}</ol>
    </div>
    <div class="tips">
      <h4>💡 Smart Tips</h4>
      <p>⏳ <strong>Purchase quarantine:</strong> Wait ${quarantine} before buying. If it still feels worthwhile afterward, reassess it calmly.</p>
      ${negatives[0] ? `<p>🧭 <strong>Main reflection:</strong> ${escapeHtml(negatives[0].q.hint)}</p>` : ''}
      <p>💳 <strong>Friction is your friend:</strong> Remove saved cards from apps and browsers. A little extra effort can interrupt an impulse purchase.</p>
    </div>
    <button class="btn result-redo" type="button" id="resultRedo">Audit Again</button>`;

  const result=document.getElementById('resultEl');
  result.innerHTML=html;
  result.classList.add('active');
  setTimeout(()=>document.getElementById('scoreFill').style.width=`${score}%`,50);
  document.getElementById('resultRedo').addEventListener('click',()=>{
    result.classList.remove('active');
    window.scrollTo({top:0,behavior:'smooth'});
    setTimeout(startQuiz,300);
  });
  result.scrollIntoView({behavior:'smooth',block:'start'});

  const history=loadHistory();
  history.push({
    item,
    value:value.toFixed(2),
    score,
    verdict,
    quarantine,
    category,
    date:new Date().toLocaleDateString('en-US')
  });
  saveHistory(history);
  renderHistory();
}

function renderHistory(){
  const history=loadHistory();
  const list=document.getElementById('historyList');
  if(!history.length){
    list.innerHTML='<div class="empty">No analysis recorded yet.</div>';
    return;
  }
  list.innerHTML=history.slice().reverse().map((entry,reversedIndex)=>{
    const index=history.length-1-reversedIndex;
    return `
      <div class="history-item">
        <div>
          <div class="history-title">${escapeHtml(entry.item)} · R$ ${escapeHtml(entry.value)}</div>
          <div class="history-meta">${escapeHtml(entry.verdict)} · Score ${entry.score} · Quarantine ${escapeHtml(entry.quarantine)} · ${escapeHtml(entry.date)}</div>
        </div>
        <div class="history-actions">
          <button class="history-redo" type="button" data-redo="${index}">Audit Again</button>
          <button class="history-delete" type="button" data-delete="${index}" aria-label="Delete">×</button>
        </div>
      </div>`;
  }).join('');
  document.querySelectorAll('[data-redo]').forEach(button=>{
    button.addEventListener('click',()=>{
      const index=Number(button.dataset.redo);
      const entry=loadHistory()[index];
      if(!entry)return;
      document.getElementById('itemName').value=entry.item||'';
      document.getElementById('itemValue').value=entry.value||'';
      document.getElementById('itemCategory').value=entry.category||'lazer';
      document.getElementById('resultEl').classList.remove('active');
      window.scrollTo({top:0,behavior:'smooth'});
      setTimeout(startQuiz,300);
    });
  });
  document.querySelectorAll('[data-delete]').forEach(button=>{
    button.addEventListener('click',()=>{
      const index=Number(button.dataset.delete);
      const current=loadHistory();
      current.splice(index,1);
      saveHistory(current);
      renderHistory();
    });
  });
}

document.getElementById('startBtn').addEventListener('click',startQuiz);
document.getElementById('quizBack').addEventListener('click',goBack);
document.getElementById('sliderNext').addEventListener('click',nextQuestion);
document.getElementById('clearHistory').addEventListener('click',()=>{
  if(confirm('Clear all history?')){
    saveHistory([]);
    renderHistory();
  }
});

renderHistory();
</script>
</body>
</html>
